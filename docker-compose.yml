services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuemesh
      POSTGRES_USER: cuemesh
      POSTGRES_PASSWORD: cuemesh_local_only
    ports:
      - "5432:5432"
    volumes:
      - cuemesh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuemesh -d cuemesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cuemesh-postgres:
